services:
  - type: web
    name: farm-shop
    runtime: php
    plan: free
    rootDir: .
    buildCommand: |
      echo "Building FARM shop on Render…"
      composer install --no-dev --no-interaction --optimize-autoloader 2>/dev/null || echo "(no composer.json yet — skipping)"
    startCommand: php -S 0.0.0.0:$PORT -t . router.php
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: farm_db
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: APP_BASE
        value: /